<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Open in Mail</title>
<style>
  :root { color-scheme: light dark; --bg: #1d6ff2; --fg: #ffffff; --muted: rgba(255,255,255,0.8); }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f4fb8; } }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  /* The whole screen is one link: tap anywhere to open the email in Mail. */
  #go { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 10px; padding: 24px 16px; box-sizing: border-box; background: var(--bg); color: var(--fg);
        text-decoration: none; text-align: center; -webkit-tap-highlight-color: rgba(0,0,0,0.15);
        font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  #title { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
  #msg { color: var(--muted); max-width: 320px; }
</style>
</head>
<body>
<a id="go" href="message://">
  <span id="title">Tap anywhere to open in Mail</span>
  <span id="msg">You can close this tab afterward.</span>
</a>
<script>
  // Home Base links here as  .../open-in-mail/#<Message-ID>.
  // The part after # never leaves this phone: browsers don't send it to the server.
  (function () {
    var id = '';
    try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    // Remove the ID from the address bar and Safari history.
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    id = id.replace(/^<|>$/g, '');
    var go = document.getElementById('go');
    if (!/^[^\s<>"]+@[^\s<>"]+$/.test(id)) {
      document.getElementById('title').textContent = 'Tap to open Mail';
      document.getElementById('msg').textContent = 'This link has no email in it, so Mail opens to your inbox.';
      return;
    }
    go.href = 'message://%3C' + encodeURI(id) + '%3E';
  })();
</script>
</body>
</html>
