<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Open in Mail</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --btn: #1d1d1b; --btn-fg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #f1f1ee; --muted: #a3a39d; --btn: #f1f1ee; --btn-fg: #151514; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; padding: 24px 16px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a.btn { display: inline-block; padding: 14px 22px; border-radius: 12px; background: var(--btn); color: var(--btn-fg);
          text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening Mail…</h1>
  <p id="msg">If Mail doesn't open, tap the button. You can close this tab afterward.</p>
  <a class="btn" id="go" href="message://">Open in Mail</a>
</main>
<script>
  // Home Base links here as  .../open-in-mail/#<Message-ID>.
  // The part after # never leaves this phone: browsers don't send it to the server.
  (function () {
    var id = '';
    try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    // Remove the ID from the address bar and Safari history.
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    id = id.replace(/^<|>$/g, '');
    var go = document.getElementById('go');
    if (!/^[^\s<>"]+@[^\s<>"]+$/.test(id)) {
      document.getElementById('title').textContent = 'Nothing to open';
      document.getElementById('msg').textContent = 'This link has no email in it. Open it from Home Base.';
      go.textContent = 'Open Mail';
      return;
    }
    var url = 'message://%3C' + encodeURI(id) + '%3E';
    go.href = url;
    location.href = url;
  })();
</script>
</body>
</html>
